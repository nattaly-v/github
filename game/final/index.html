<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of PIG</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>

    <main>
        <div id="sky">
            <img src="images/clouds.svg" alt="clouds" class="clouds" width="1137" height="218">
        </div>

        <header id="sign">
            <div id="board">
                <h1>Game of Pig</h1>
                <div id="score"></div>
            </div>
            <div id="game"></div>
        </header>

        <div id="gamecontrol">
            <h2>Start a Game</h2>
            <button id="startgame">Randomly Pick the First Player, and Start the Game</button>
        </div>

        <div id="actions"></div>

        <!-- PENALTY OVERLAY: shown when a 1 or snake eyes is rolled -->
        <div id="overlay-penalty" class="overlay hidden">
            <div class="overlay-box">
                <p id="overlay-penalty-msg"></p>
            </div>
        </div>

        <!-- WINNER OVERLAY: shown when someone wins -->
        <div id="overlay-winner" class="overlay hidden">
            <div class="overlay-box">
                <p id="overlay-winner-msg"></p>
                <button id="overlay-newgame">Play Again?</button>
            </div>
        </div>

        <section id="scene">
            <!-- PLAYER 1 -->
            <div class="side" id="p1">
                <div class="card-1">
                    <p class="name">Player 1</p>
                    <p class="pts" id="p1-score">0</p>
                </div>
                <img src="images/post-1.svg" alt="" class="post-1" width="268" height="434">
            </div>

            <!-- GROUND -->
            <div id="ground">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
                <img src="images/flower.svg" alt="" class="flower" width="73" height="96">
            </div>

            <!-- BARNS -->
            <div id="barns">
                <div class="barn">
                    <div class="barn-img-wrap">
                        <img src="images/barn-left.svg" alt="Left barn" class="barn-img" width="191" height="456">
                        <img src="images/die-6.svg" alt="Die" id="die-left" class="die-img">
                    </div>
                </div>
                <div class="barn">
                    <div class="barn-img-wrap">
                        <img src="images/barn-right.svg" alt="Right barn" class="barn-img" width="191" height="456">
                        <img src="images/die-1.svg" alt="Die" id="die-right" class="die-img">
                    </div>
                </div>
            </div>

            <!-- PLAYER 2 -->
            <div class="side" id="p2">
                <img src="images/post-2.svg" alt="" class="post-2" width="268" height="434">
                <div class="card-2">
                    <p class="name">Player 2</p>
                    <p class="pts" id="p2-score">0</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p><a href="/index.html">Back to Portal Page</a></p>
    </footer>

</body>

</html>
